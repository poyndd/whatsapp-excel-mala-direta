publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^8.1.2
  excel: ^4.0.6
  url_launcher: ^6.3.0
